services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: secop-api
    restart: unless-stopped
    env_file: .env
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      - default
      - coolify

networks:
  coolify:
    external: true
    name: coolify
