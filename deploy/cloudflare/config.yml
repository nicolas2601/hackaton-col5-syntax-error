# cloudflared config — tikno tunnel
# Path destino en el server: /etc/cloudflared/config.yml
#
# Subdominios:
#   - api.tikno.pro          → Coolify Traefik (HTTPS interno)
#   - api-ronda2.tikno.pro   → FastAPI hackathon ronda 2 (puerto 8000) [NUEVO]
#   - panel.tikno.pro        → Next.js dashboard (puerto 3000)         [NUEVO]
#   - coolify.tikno.pro      → Coolify panel (HTTPS interno)
#   - catch-all              → 404
#
# IMPORTANTE: el orden de las reglas importa. Las más específicas primero.
# Las apps Coolify exponen sus puertos en localhost vía Traefik routing,
# pero como los apps tienen healthcheck propio y los Traefik labels apuntan
# a su domain, podemos rutear directo al port mapping si Coolify usa hostports,
# o vía Traefik si no. Aquí asumimos Traefik (https://localhost:443) para
# los apps gestionados por Coolify y rutas directas para servicios bare.

tunnel: TIKNO_TUNNEL_ID  # mantener el ID existente, NO sobreescribir
credentials-file: /etc/cloudflared/credentials.json

# Ajustes globales de origen
originRequest:
  connectTimeout: 30s
  tcpKeepAlive: 30s
  noHappyEyeballs: false
  keepAliveConnections: 100
  keepAliveTimeout: 90s

ingress:
  # ─── Coolify-managed (Traefik HTTPS routing por hostname) ───
  - hostname: api.tikno.pro
    service: https://localhost:443
    originRequest:
      noTLSVerify: true
      httpHostHeader: api.tikno.pro

  - hostname: api-ronda2.tikno.pro
    service: https://localhost:443
    originRequest:
      noTLSVerify: true
      httpHostHeader: api-ronda2.tikno.pro

  - hostname: panel.tikno.pro
    service: https://localhost:443
    originRequest:
      noTLSVerify: true
      httpHostHeader: panel.tikno.pro

  - hostname: coolify.tikno.pro
    service: https://localhost:443
    originRequest:
      noTLSVerify: true
      httpHostHeader: coolify.tikno.pro

  # ─── Catch-all ──────────────────────────────────────────────
  - service: http_status:404
